<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 444" width="440" height="444" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/></marker>
    <marker id="agS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2"
            orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/></marker>
  </defs>
  <rect x="135.0" y="6.0" width="130" height="36" rx="18.0" fill="#3fd28a" stroke="#111" stroke-width="1.1"/>
  <text x="200" y="28" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">start</text>
  <path d="M 200 42 V 62" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <polygon points="127.0,63.0 285.0,63.0 273.0,105.0 115.0,105.0" fill="#b3a07a" stroke="#111" stroke-width="1.1"/>
  <text x="200" y="88.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">read n</text>
  <path d="M 200 105 V 124" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="125.0" y="124.0" width="150" height="52" fill="#c8c8c8" stroke="#111" stroke-width="1.1"/>
  <text x="200" y="142.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">r ← 0</text>
  <text x="200" y="166.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">i ← 1</text>
  <path d="M 200 176 V 196" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <polygon points="200,198.0 285.0,236 200,274.0 115.0,236" fill="#f0645f" stroke="#111" stroke-width="1.1"/>
  <text x="200" y="240.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">i ≤ n ?</text>
  <path d="M 200 274 V 300" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="222" y="292" text-anchor="middle" font-size="18" fill="#333" font-weight="normal" font-style="italic">yes</text>
  <rect x="115.0" y="302.0" width="170" height="52" fill="#c8c8c8" stroke="#111" stroke-width="1.1"/>
  <text x="200" y="320.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">r ← r + i</text>
  <text x="200" y="344.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">i ← i + 2</text>
  <path d="M 115 328 H 60 V 236 H 111" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M 285 236 H 365 V 330" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="304" y="226" text-anchor="middle" font-size="18" fill="#333" font-weight="normal" font-style="italic">no</text>
  <polygon points="312.0,331.0 430.0,331.0 418.0,373.0 300.0,373.0" fill="#b3a07a" stroke="#111" stroke-width="1.1"/>
  <text x="365" y="356.0" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">return r</text>
  <path d="M 365 373 V 400" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="305.0" y="402.0" width="120" height="36" rx="18.0" fill="#3fd28a" stroke="#111" stroke-width="1.1"/>
  <text x="365" y="424" text-anchor="middle" font-size="20" fill="#111" font-weight="bold" font-style="normal">stop</text>
