<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 196" width="560" height="196" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e5496"/></marker></defs>
  <text x="10" y="22" font-size="19" fill="#666666" font-weight="normal" font-style="normal" text-anchor="start">source code</text>
  <rect x="6" y="32" width="150" height="114" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
  <text x="18" y="62" font-size="19" fill="#111" font-weight="normal" font-style="normal" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace">x = 3</text>
  <text x="18" y="90" font-size="19" fill="#111" font-weight="normal" font-style="normal" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace">y = x * 2</text>
  <text x="18" y="118" font-size="19" fill="#111" font-weight="normal" font-style="normal" text-anchor="start" font-family="DejaVu Sans Mono, Consolas, monospace">print(y)</text>
  <rect x="208" y="40" width="190" height="96" rx="10" fill="#a6e1f4" stroke="#3e5496" stroke-width="2.5"/>
  <text x="303" y="76" font-size="23" fill="#111" font-weight="bold" font-style="normal" text-anchor="middle">Interpreter</text>
  <text x="303" y="106" font-size="17" fill="#333" font-weight="normal" font-style="normal" text-anchor="middle">one line: translate,</text>
  <text x="303" y="126" font-size="17" fill="#333" font-weight="normal" font-style="normal" text-anchor="middle">run, next line</text>
  <line x1="160" y1="88" x2="204" y2="88" stroke="#3e5496" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 356 138 C 356 178, 250 178, 250 140" fill="none" stroke="#3e5496" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="303" y="190" font-size="17" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="middle">on every run</text>
  <rect x="444" y="58" width="110" height="62" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
  <text x="499" y="84" font-size="18" fill="#666666" font-weight="normal" font-style="normal" text-anchor="middle">output</text>
  <text x="499" y="110" font-size="21" fill="#111" font-weight="normal" font-style="normal" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">6</text>
  <line x1="400" y1="88" x2="440" y2="88" stroke="#3e5496" stroke-width="2.5" marker-end="url(#a)"/>
