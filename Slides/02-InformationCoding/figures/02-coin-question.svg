<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.1 14.6 250.2 213.1" width="250" height="213"
     font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3f3f"/>
    </marker>
  </defs>

  <!-- decision node -->
  <polygon points="150,20 250,105 150,190 50,105"
           fill="#f2f2f2" stroke="#3f3f3f" stroke-width="2"/>
  <text x="150" y="99" text-anchor="middle" font-size="19">Is it</text>
  <text x="150" y="121" text-anchor="middle" font-size="19">heads?</text>

  <!-- branches -->
  <line x1="90" y1="150" x2="55" y2="185" stroke="#3f3f3f" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="210" y1="150" x2="245" y2="185" stroke="#3f3f3f" stroke-width="3" marker-end="url(#ah)"/>
  <text x="40" y="220" text-anchor="middle" font-size="18">no</text>
  <text x="260" y="220" text-anchor="middle" font-size="18">yes</text>
</svg>
